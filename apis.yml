description: 'LuxCreo is a hardtech company delivering same-day dental 3D printing through an integrated
  ecosystem of hardware, materials, and cloud software. Its dental line pairs the FDA Class II 510(k)-cleared
  iLux Pro Dental printer, iLuxWash cleaning, and iLuxCure curing hardware with proprietary resins and
  ActiveMemory polymer technology (4D Aligner, 4D Bright). The software stack — LuxFlow Pro print prep,
  LuxDesign AI design automation, LuxLink fleet management, and the LuxCloud Dental platform — runs the
  in-house aligner and appliance workflow. Backed by Kleiner Perkins. Surfaced as a portfolio-lead stub and
  processed by the API Evangelist enrichment pipeline; no public developer API surface was found.'
